mcs.metadata:
  componentName: Fim da conversa
  description: |-
    Esse tópico do sistema é disparado apenas por uma ação de redirecionamento,
    e guia o usuário para classificar a conversa com o agente.
kind: AdaptiveDialog
startBehavior: CancelOtherTopics
beginDialog:
  kind: OnSystemRedirect
  id: main
  actions:
    - kind: Question
      id: 41d42054-d4cb-4e90-b922-2b16b37fe379
      conversationOutcome: ResolvedImplied
      alwaysPrompt: true
      variable: init:Topic.SurveyResponse
      prompt: Consegui te ajudar com sua solicitação de empréstimo ou consulta de status?
      entity: BooleanPrebuiltEntity

    - kind: ConditionGroup
      id: condition-0
      conditions:
        - id: condition-0-item-0
          condition: =Topic.SurveyResponse = true
          actions:
            - kind: CSATQuestion
              id: csat_1
              conversationOutcome: ResolvedConfirmed

            - kind: SendActivity
              id: sendMessage_8r29O0
              activity: Obrigado por avaliar meu atendimento!

            - kind: Question
              id: question_1
              alwaysPrompt: true
              variable: init:Topic.Continue
              prompt: Posso ajudar com algo mais?
              entity: BooleanPrebuiltEntity

            - kind: ConditionGroup
              id: condition-1
              conditions:
                - id: condition-1-item-0
                  condition: =Topic.Continue = true
                  actions:
                    - kind: SendActivity
                      id: sendMessage_4eOE6h
                      activity: Sem problemas, ainda estou aqui. Pode digitar o que deseja?

              elseActions:
                - kind: SendActivity
                  id: yHBz55
                  activity: Obrigado(a) por utilizar o EmprestAI. Até a próxima!

                - kind: EndConversation
                  id: jh1GMT

      elseActions:
        - kind: Question
          id: PM68ot
          alwaysPrompt: true
          variable: init:Topic.TryAgain
          prompt: Sinto muito por não ter conseguido te ajudar. Você pode tentar novamente ou falar diretamente com a equipe da TechLoc pelos nossos canais de contato.
          entity: BooleanPrebuiltEntity

        - kind: ConditionGroup
          id: KNxYBf
          conditions:
            - id: DPveFP
              condition: =Topic.TryAgain = false
              actions:
                - kind: BeginDialog
                  id: cngqi4
                  dialog: cr113_AssistentedeEmprstimodeEquipamentos.topic.Escalate

          elseActions:
            - kind: SendActivity
              id: GrVHEW
              activity: Sem problemas, ainda estou aqui. Pode digitar o que deseja?